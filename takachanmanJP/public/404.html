<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <!--
      SPA fallback for GitHub Pages.
      Project Pages = segmentCount 1 (/<repo>/...).
      Based on https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      ;(function () {
        var segmentCount = 1
        var l = window.location
        var path = l.pathname.split('/').slice(0, 1 + segmentCount).join('/')
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            path +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(segmentCount)
              .join('/') +
            (l.search ? l.search.replace(/&/g, '~and~') : '') +
            l.hash,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
